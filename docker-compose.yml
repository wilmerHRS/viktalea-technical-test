# PostgreSQL local para desarrollo y tests.
# Las credenciales están aquí mismo (solo para uso local). Si las cambias:
#   1. actualiza DATABASE_URL en .env
#   2. ejecuta `npm run db:reset` (Postgres solo las aplica al crear el volumen)
services:
  postgres:
    image: postgres:17-alpine
    container_name: cashin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cashin
      POSTGRES_PASSWORD: cashin_local
      POSTGRES_DB: cashin            # base de la app; el init crea también "cashin_test"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro   # usa $POSTGRES_USER / $POSTGRES_DB
    healthcheck:
      # $$ = la variable se resuelve dentro del contenedor (toma los valores de environment)
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
